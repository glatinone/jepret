[package]
name = "jepret"
version = "1.0.0"
edition = "2021"
description = "A 300 KB screenshot and annotation tool for Windows that idles at 1.3 MB"
license = "MIT"
repository = "https://github.com/glatinone/jepret"
authors = ["Kiell Tampubolon"]
keywords = ["screenshot", "windows", "win32", "annotation", "gdi"]
categories = ["gui", "multimedia::images"]

[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
